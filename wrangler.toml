# Cloudflare Workers (static assets). Connect the repo with build command
# `npm run build`; the default deploy command `npx wrangler deploy` reads this.
# Unknown paths serve index.html so deep links like /demo/candidates/:id load.
name = "recruited"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
